---
- name: Tear down the appliance and relay through the shipped playbook
  ansible.builtin.import_playbook: network.evpn_gateway.teardown

- name: Tear down the test-only workload VTEP
  hosts: cloud_workload
  become: true
  tasks:
    - name: Tear down the standalone workload VTEP configuration
      ansible.builtin.include_role:
        name: network.evpn_gateway_test.evpn_cloud_workload
        tasks_from: teardown
