---
- name: Deploy the infra relay
  hosts: cloud_infra
  roles:
    - network.evpn_gateway.evpn_cloud_infra

- name: Deploy the workload VTEP
  hosts: cloud_workload
  roles:
    - network.evpn_gateway_test.evpn_cloud_workload

- name: Deploy the on-prem appliance
  hosts: onprem_appliances
  pre_tasks:
    - name: Resolve the relay endpoint on the container underlay
      ansible.builtin.lineinfile:
        path: /etc/hosts
        line: "{{ hostvars[infra_relay_host].ansible_facts.default_ipv4.address }} {{ infra_relay_host }}"
        unsafe_writes: true
  roles:
    - network.evpn_gateway.evpn_onprem_appliance

- name: Verify the teardown starting state
  hosts: all
  gather_facts: false
  tasks:
    - name: Require deployed networking before teardown
      ansible.builtin.command: ip link show dev {{ item }}
      loop: "{{ ['br-vni10100', 'vxlan10100'] if 'cloud_workload' in group_names else ['wg0'] }}"
      changed_when: false
